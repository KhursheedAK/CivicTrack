services:
  db:
    image: postgres:15
    container_name: civic-db
    environment:
      POSTGRES_USER: civictrack
      POSTGRES_PASSWORD: civictrack
      POSTGRES_DB: civictrack
    ports:
      - "5434:5432"
    volumes:
      - civic_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civictrack -d civictrack"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: civic-backend
    container_name: civic-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://civictrack:civictrack@db:5432/civictrack
      JWT_ACCESS_SECRET: civictrack-access-secret-change-in-production
      JWT_REFRESH_SECRET: civictrack-refresh-secret-change-in-production
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
    volumes:
      - civic_state:/civic-state
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/departments', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    image: civic-frontend
    container_name: civic-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  civic_db:
  civic_state:
